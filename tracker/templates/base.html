<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Habit tracker — твои привычки с заботой{% endblock %}</title>

    {% load static %}

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #4a4a4a;
            position: relative;
            background: linear-gradient(135deg, #fff5f5 0%, #fff0f7 100%);
        }

        /* Цветочки на всём фоне */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150"><text x="0" y="30" font-size="30" fill="%23ffb7c5" opacity="0.12">🌸</text><text x="50" y="80" font-size="25" fill="%23ffc4d0" opacity="0.1">🌼</text><text x="20" y="130" font-size="28" fill="%23ffb7c5" opacity="0.08">🌷</text></svg>');
            background-repeat: repeat;
            background-size: 80px 80px;
            pointer-events: none;
            z-index: 0;
        }

        /* Контент поверх цветочков */
        .content-wrapper {
            position: relative;
            z-index: 1;
            padding-top: 80px;
            background: transparent;
        }

        /* Шапка с профилем и навигацией */
        .header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            z-index: 1000;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: none;
            box-shadow: 0 2px 20px rgba(255, 150, 150, 0.06);
        }

        /* Эффект затухания - через псевдоэлемент, который НЕ МЕШАЕТ кликам */
        .header::after {
            content: "";
            position: absolute;
            bottom: -30px;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(to bottom, rgba(255, 245, 245, 0.8), transparent);
            pointer-events: none;
            z-index: -1;
        }

        /* Навигационное меню */
        .nav-menu {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-link {
            text-decoration: none;
            color: #4a4a4a;
            font-weight: 500;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link:hover {
            background: rgba(255, 240, 240, 0.9);
            color: #ff6b9d;
            transform: translateY(-2px);
        }

        .nav-link.active {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: white;
        }

        /* Блок справа - прижат к краю */
        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-left: auto;
        }

        /* Профиль - контейнер для hover */
        .profile-container {
            position: relative;
            display: inline-block;
        }

        .profile-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(255, 150, 150, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .profile-icon:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 150, 150, 0.25);
        }

        /* Выпадающее меню */
        .dropdown-menu {
            position: absolute;
            top: 55px;
            right: 0;
            background: white;
            border-radius: 20px;
            padding: 0.5rem;
            min-width: 160px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 180, 180, 0.4);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 1001;
            pointer-events: none;
        }

        /* Показываем меню при наведении */
        .profile-container:hover .dropdown-menu,
        .dropdown-menu:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Мостик между иконкой и меню */
        .dropdown-menu::before {
            content: "";
            position: absolute;
            top: -10px;
            right: 10px;
            width: 30px;
            height: 10px;
            background: transparent;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1rem;
            text-decoration: none;
            color: #4a4a4a;
            border-radius: 15px;
            transition: all 0.2s;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .dropdown-item:hover {
            background: rgba(255, 200, 200, 0.4);
            color: #ff6b9d;
        }

        .dropdown-divider {
            height: 1px;
            background: rgba(255, 180, 180, 0.4);
            margin: 0.3rem 0;
        }

        .content-wrapper > :first-child {
            margin-top: 0;
        }

        @media (max-width: 768px) {
            .header {
                padding: 0.6rem 1rem;
            }

            .nav-menu {
                gap: 0.3rem;
            }

            .nav-link {
                padding: 0.4rem 0.8rem;
                font-size: 0.85rem;
            }

            .profile-icon {
                width: 38px;
                height: 38px;
                font-size: 1.2rem;
            }

            .content-wrapper {
                padding-top: 70px;
            }

            .dropdown-menu {
                top: 45px;
                min-width: 140px;
            }
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <div class="header">
        <div class="nav-menu">
            <a href="url 'tracker' " class="nav-link">
                🏠 Главная
            </a>
            <a href="#" class="nav-link">
                📋 Привычки
            </a>
            <a href="#" class="nav-link">
                📊 Статистика
            </a>
        </div>

        <div class="header-right">
            <div class="profile-container">
                <div class="profile-icon">
                    👤
                </div>
                <div class="dropdown-menu">
                    <a href="#" class="dropdown-item">
                        ⚙️ Профиль
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="url 'logout' " class="dropdown-item">
                        🚪 Выйти
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="content-wrapper">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
