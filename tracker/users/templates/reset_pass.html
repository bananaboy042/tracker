<!-- password_reset.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля — Habit tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fef5f7 0%, #fef0f5 100%);
            position: relative;
            color: #4a2f3a;
        }

        /* Цветочки на фоне */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="5" y="25" font-size="22" fill="%23e8c4d0" opacity="0.3">🌸</text><text x="45" y="70" font-size="18" fill="%23f0d0d8" opacity="0.25">🌼</text><text x="75" y="40" font-size="16" fill="%23e8c4d0" opacity="0.2">🌷</text></svg>');
            background-repeat: repeat;
            background-size: 70px 70px;
            pointer-events: none;
            z-index: 0;
        }

        /* Менюшка */
        .simple-menu {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            padding: 1rem 2rem;
            display: flex;
            justify-content: flex-end;
            gap: 2rem;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            z-index: 10;
            border-bottom: 1px solid rgba(255, 200, 200, 0.3);
        }

        .simple-menu a {
            text-decoration: none;
            color: #8e6b78;
            font-weight: 500;
            transition: color 0.3s;
        }

        .simple-menu a:hover {
            color: #d9a5b3;
        }

        /* Основной контейнер */
        .reset-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 2rem 3rem;
            position: relative;
            z-index: 1;
        }

        .reset-container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        /* Карточка */
        .reset-card {
            background: white;
            border-radius: 40px;
            padding: 2rem 2rem 2rem 2rem;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid #f2e4e8;
        }

        .hero-emoji {
            font-size: 3.5rem;
            text-align: center;
            margin-bottom: 1rem;
            animation: wave 2s infinite;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(-5deg); }
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            color: #4a2f3a;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #b0949e;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* Индикатор шагов */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }

        .step-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f0dee3;
            color: #b0949e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .step.active .step-number {
            background: #d9a5b3;
            color: white;
        }

        .step-label {
            font-size: 0.7rem;
            color: #b0949e;
        }

        .step.active .step-label {
            color: #d9a5b3;
            font-weight: 600;
        }

        /* Форма */
        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #5a3d4a;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1.5px solid #f0dee3;
            border-radius: 25px;
            font-size: 0.95rem;
            background: white;
            transition: all 0.3s;
            outline: none;
            color: #4a2f3a;
        }

        input:focus {
            border-color: #d9a5b3;
            box-shadow: 0 0 0 3px rgba(217, 165, 179, 0.1);
        }

        input::placeholder {
            color: #d0b8c0;
        }

        input.code-input {
            text-align: center;
            letter-spacing: 4px;
            font-size: 1.3rem;
        }

        /* Кнопки */
        .btn-action {
            width: 100%;
            background: #d9a5b3;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            padding: 1rem;
            border-radius: 40px;
            margin: 0.5rem 0;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-action:hover {
            background: #c48b9b;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(217, 165, 179, 0.3);
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Повторная отправка */
        .resend-area {
            margin: 1rem 0;
            text-align: center;
        }

        .btn-resend {
            background: none;
            border: none;
            color: #d9a5b3;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
        }

        .btn-resend:disabled {
            color: #d0b8c0;
            cursor: not-allowed;
        }

        .timer {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #c8adb6;
        }

        /* Ссылка назад */
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #c8adb6;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link a:hover {
            color: #d9a5b3;
            text-decoration: underline;
        }

        /* Сообщения */
        .errorlist {
            list-style: none;
            color: #e0868a;
            font-size: 0.8rem;
            margin-top: 0.3rem;
            margin-left: 0.5rem;
        }

        .nonfield-errors {
            background: #fee8e8;
            border-radius: 20px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            color: #e0868a;
            font-size: 0.85rem;
            text-align: center;
        }

        .success-message {
            background: rgba(100, 180, 100, 0.1);
            border-radius: 20px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            color: #6b8c6b;
            font-size: 0.85rem;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .phone-info {
            background: #fef5f7;
            border-radius: 30px;
            padding: 0.7rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #8e6b78;
            text-align: center;
        }

        .footer-emojis {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 1.1rem;
            opacity: 0.5;
            letter-spacing: 0.3rem;
        }

        @media (max-width: 600px) {
            .reset-card {
                padding: 1.5rem;
            }
            h2 {
                font-size: 1.5rem;
            }
            .simple-menu {
                padding: 0.8rem 1.5rem;
            }
            .reset-wrapper {
                padding: 5rem 1rem 2rem;
            }
            .step-indicator {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Менюшка -->
    <div class="simple-menu">
        <a href="{% url 'main' %}">Главная</a>
        <a href="#">О нас</a>
        <a href="#">Помощь</a>
    </div>

    <div class="reset-wrapper">
        <div class="reset-container">
            <div class="reset-card">
                <div class="hero-emoji">
                    🔐
                </div>

                <h2>Восстановить пароль</h2>
                <div class="subtitle">
                    Мы поможем вернуть доступ к аккаунту
                </div>

                <!-- Индикатор шагов -->
                <div class="step-indicator" id="stepIndicator">
                    <div class="step active" data-step="1">
                        <div class="step-number">1</div>
                        <div class="step-label">Логин</div>
                    </div>
                    <div class="step" data-step="2">
                        <div class="step-number">2</div>
                        <div class="step-label">Код</div>
                    </div>
                    <div class="step" data-step="3">
                        <div class="step-number">3</div>
                        <div class="step-label">Новый пароль</div>
                    </div>
                </div>

                <!-- Блок для сообщений -->
                <div id="messageArea"></div>

                <!-- ШАГ 1: Ввод логина -->
                <div id="step1" class="step-content">
                    <form id="loginForm">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Имя пользователя</label>
                            <input type="text"
                                   id="username"
                                   name="username"
                                   placeholder="Твой логин"
                                   autofocus
                                   required>
                        </div>
                        <button type="submit" class="btn-action">
                            📱 Отправить код
                        </button>
                    </form>
                </div>

                <!-- ШАГ 2: Ввод кода из SMS -->
                <div id="step2" class="step-content hidden">
                    <div id="phoneInfo" class="phone-info"></div>
                    <form id="codeForm">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Код из SMS</label>
                            <input type="text"
                                   id="code"
                                   name="code"
                                   class="code-input"
                                   placeholder="000000"
                                   maxlength="6"
                                   autocomplete="off"
                                   required>
                        </div>
                        <button type="submit" class="btn-action">
                            ✅ Проверить код
                        </button>
                    </form>
                    <div class="resend-area">
                        <button id="resendBtn" class="btn-resend" disabled>
                            📱 Отправить код повторно
                        </button>
                        <div id="timer" class="timer">Повторная отправка через 60 секунд</div>
                    </div>
                </div>

                <!-- ШАГ 3: Установка нового пароля -->
                <div id="step3" class="step-content hidden">
                    <form id="passwordForm">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Новый пароль</label>
                            <input type="password"
                                   id="new_password"
                                   name="new_password"
                                   placeholder="••••••••"
                                   required>
                        </div>
                        <div class="form-group">
                            <label>Подтверждение пароля</label>
                            <input type="password"
                                   id="confirm_password"
                                   name="confirm_password"
                                   placeholder="••••••••"
                                   required>
                        </div>
                        <button type="submit" class="btn-action">
                            🔒 Сохранить пароль
                        </button>
                    </form>
                </div>

                <div class="back-link">
                    <a href="{% url 'loginuser' %}">← Вернуться ко входу</a>
                </div>

                <div class="footer-emojis">
                    🔐  🌸  📱
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 1;
        let remainingSeconds = 0;
        let timerInterval = null;
        let tempUsername = '';

        // Элементы DOM
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const messageArea = document.getElementById('messageArea');
        const stepIndicator = document.getElementById('stepIndicator');
        const resendBtn = document.getElementById('resendBtn');
        const timerDiv = document.getElementById('timer');
        const phoneInfo = document.getElementById('phoneInfo');

        // Функция показа сообщений
        function showMessage(text, type = 'error') {
            messageArea.innerHTML = `<div class="${type === 'error' ? 'nonfield-errors' : 'success-message'}">${text}</div>`;
            setTimeout(() => {
                if (messageArea.innerHTML === `<div class="${type === 'error' ? 'nonfield-errors' : 'success-message'}">${text}</div>`) {
                    messageArea.innerHTML = '';
                }
            }, 5000);
        }

        // Обновление индикатора шагов
        function updateStepIndicator(step) {
            const steps = stepIndicator.querySelectorAll('.step');
            steps.forEach((s, index) => {
                if (index + 1 <= step) {
                    s.classList.add('active');
                } else {
                    s.classList.remove('active');
                }
            });
        }

        // Переключение между шагами
        function goToStep(step) {
            currentStep = step;
            step1.classList.add('hidden');
            step2.classList.add('hidden');
            step3.classList.add('hidden');

            if (step === 1) step1.classList.remove('hidden');
            if (step === 2) step2.classList.remove('hidden');
            if (step === 3) step3.classList.remove('hidden');

            updateStepIndicator(step);

            if (step === 1) document.getElementById('username').focus();
            if (step === 2) document.getElementById('code').focus();
            if (step === 3) document.getElementById('new_password').focus();
        }

        // Таймер
        function startTimer(seconds = 60) {
            remainingSeconds = seconds;
            resendBtn.disabled = true;

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    resendBtn.disabled = false;
                    timerDiv.textContent = 'Вы можете запросить новый код';
                } else {
                    timerDiv.textContent = `Повторная отправка через ${remainingSeconds} секунд`;
                    remainingSeconds--;
                }
            }, 1000);
        }

        // ШАГ 1: Отправка логина
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            tempUsername = username;

            if (!username) {
                showMessage('Введите имя пользователя');
                return;
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = '⏳ Отправляем...';
            btn.disabled = true;

            try {
                const response = await fetch('', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ username: username })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ Код отправлен на ваш номер телефона!', 'success');
                    phoneInfo.textContent = `Код отправлен на номер ${data.phone_masked || 'ваш телефон'}`;
                    startTimer(60);
                    goToStep(2);
                } else {
                    showMessage(data.error || 'Пользователь не найден или у него не указан телефон');
                }
            } catch (error) {
                showMessage('Ошибка соединения. Попробуйте позже.');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });

        // ШАГ 2: Проверка кода
        document.getElementById('codeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('code').value.trim();

            if (!code || code.length !== 6) {
                showMessage('Введите 6-значный код из SMS');
                return;
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = '⏳ Проверяем...';
            btn.disabled = true;

            try {
                const response = await fetch('{% url "verify_reset_code" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        username: tempUsername,
                        code: code
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ Код подтверждён! Придумайте новый пароль.', 'success');
                    goToStep(3);
                } else {
                    showMessage(data.error || 'Неверный код. Попробуйте ещё раз.');
                }
            } catch (error) {
                showMessage('Ошибка проверки кода');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });

        // Повторная отправка кода
        resendBtn.addEventListener('click', async () => {
            if (resendBtn.disabled) return;

            resendBtn.disabled = true;
            resendBtn.textContent = '⏳ Отправляем...';

            try {
                const response = await fetch('', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ username: tempUsername })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ Новый код отправлен!', 'success');
                    startTimer(60);
                } else {
                    showMessage(data.error || 'Не удалось отправить код');
                    resendBtn.disabled = false;
                }
            } catch (error) {
                showMessage('Ошибка отправки');
                resendBtn.disabled = false;
            } finally {
                resendBtn.textContent = '📱 Отправить код повторно';
            }
        });

        // ШАГ 3: Установка нового пароля
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (!newPassword || newPassword.length < 6) {
                showMessage('Пароль должен быть не менее 6 символов');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('Пароли не совпадают');
                return;
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = '⏳ Сохраняем...';
            btn.disabled = true;

            try {
                const response = await fetch('{% url "res_pas" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        username: tempUsername,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ Пароль успешно изменён! Сейчас вас перенаправим...', 'success');
                    setTimeout(() => {
                        window.location.href = '{% url "loginuser" %}';
                    }, 2000);
                } else {
                    showMessage(data.error || 'Ошибка при смене пароля');
                }
            } catch (error) {
                showMessage('Ошибка соединения');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });

        // Автоматический переход при вводе 6 цифр
        document.getElementById('code').addEventListener('input', (e) => {
            if (e.target.value.length === 6) {
                document.getElementById('codeForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
