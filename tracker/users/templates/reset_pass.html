<!-- password_reset.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля — Habit tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fff0f7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a4a4a;
        }

        .container {
            max-width: 450px;
            width: 100%;
            padding: 1.5rem;
            text-align: center;
        }

        .simple-menu {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .simple-menu a {
            text-decoration: none;
            color: #b88c8c;
            transition: color 0.3s;
        }

        .simple-menu a:hover {
            color: #ff6b9d;
        }

        .reset-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 2rem 1.8rem;
            box-shadow: 0 20px 40px rgba(255, 150, 150, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .hero-emoji {
            font-size: 3.5rem;
            margin-bottom: 0.8rem;
            animation: wave 2s infinite;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(-5deg); }
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            background: linear-gradient(135deg, #ff8a8a, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #a67c7c;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }

        .step-number {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ffd9d9;
            color: #b85c5c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .step.active .step-number {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: white;
        }

        .step-label {
            font-size: 0.7rem;
            color: #b88c8c;
        }

        .step.active .step-label {
            color: #ff6b9d;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.3rem;
            color: #b85c5c;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid rgba(255, 200, 200, 0.5);
            border-radius: 30px;
            font-size: 0.95rem;
            background: white;
            transition: all 0.3s;
            outline: none;
        }

        input:focus {
            border-color: #ff9a9e;
            box-shadow: 0 0 0 3px rgba(255, 154, 158, 0.2);
        }

        input.code-input {
            text-align: center;
            letter-spacing: 4px;
            font-size: 1.3rem;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 1rem;
            border-radius: 50px;
            margin: 1rem 0 0.5rem;
            box-shadow: 0 10px 20px rgba(255, 150, 150, 0.3);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 150, 150, 0.4);
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .resend-area {
            margin: 1rem 0;
            text-align: center;
        }

        .btn-resend {
            background: none;
            border: none;
            color: #ff8a8a;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
        }

        .btn-resend:disabled {
            color: #d6b5b5;
            cursor: not-allowed;
        }

        .timer {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #d6a5a5;
        }

        .back-link {
            margin-top: 1rem;
        }

        .back-link a {
            color: #b88c8c;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link a:hover {
            color: #ff6b9d;
            text-decoration: underline;
        }

        .errorlist {
            list-style: none;
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            margin-left: 0.5rem;
        }

        .nonfield-errors {
            background: rgba(255, 107, 107, 0.1);
            border-radius: 20px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            color: #ff6b6b;
            font-size: 0.9rem;
        }

        .success-message {
            background: rgba(76, 175, 80, 0.1);
            border-radius: 20px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            color: #4CAF50;
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }

        .phone-info {
            background: rgba(255, 200, 200, 0.3);
            border-radius: 30px;
            padding: 0.6rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #b85c5c;
        }

        .footer-emojis {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            opacity: 0.5;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }
            .reset-card {
                padding: 1.5rem;
            }
            h2 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="simple-menu">
            <a href="{% url 'main' %}">Главная</a>
            <a href="#">О нас</a>
            <a href="#">Помощь</a>
        </div>

        <div class="reset-card">
            <div class="hero-emoji">
                🔐
            </div>

            <h2>Восстановить пароль</h2>
            <div class="subtitle">
                Мы поможем вернуть доступ к аккаунту
            </div>

            <!-- Индикатор шагов -->
            <div class="step-indicator" id="stepIndicator">
                <div class="step active" data-step="1">
                    <div class="step-number">1</div>
                    <div class="step-label">Логин</div>
                </div>
                <div class="step" data-step="2">
                    <div class="step-number">2</div>
                    <div class="step-label">Код</div>
                </div>
                <div class="step" data-step="3">
                    <div class="step-number">3</div>
                    <div class="step-label">Новый пароль</div>
                </div>
            </div>

            <!-- Блок для сообщений -->
            <div id="messageArea"></div>

            <!-- ШАГ 1: Ввод логина -->
            <div id="step1" class="step-content">
                <form id="loginForm">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Имя пользователя</label>
                        <input type="text"
                               id="username"
                               name="username"
                               placeholder="login"
                               autofocus
                               required>
                    </div>
                    <button type="submit" class="btn-action">
                        📱 Отправить код
                    </button>
                </form>
            </div>

            <!-- ШАГ 2: Ввод кода из SMS (скрыт сначала) -->
            <div id="step2" class="step-content hidden">
                <div id="phoneInfo" class="phone-info"></div>
                <form id="codeForm">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Код из SMS</label>
                        <input type="text"
                               id="code"
                               name="code"
                               class="code-input"
                               placeholder="000000"
                               maxlength="6"
                               autocomplete="off"
                               required>
                    </div>
                    <button type="submit" class="btn-action">
                        ✅ Проверить код
                    </button>
                </form>
                <div class="resend-area">
                    <button id="resendBtn" class="btn-resend" disabled>
                        📱 Отправить код повторно
                    </button>
                    <div id="timer" class="timer">Повторная отправка через 60 секунд</div>
                </div>
            </div>

            <!-- ШАГ 3: Установка нового пароля (скрыт сначала) -->
            <div id="step3" class="step-content hidden">
                <form id="passwordForm">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Новый пароль</label>
                        <input type="password"
                               id="new_password"
                               name="new_password"
                               placeholder="••••••••"
                               required>
                    </div>
                    <div class="form-group">
                        <label>Подтверждение пароля</label>
                        <input type="password"
                               id="confirm_password"
                               name="confirm_password"
                               placeholder="••••••••"
                               required>
                    </div>
                    <button type="submit" class="btn-action">
                        🔒 Сохранить пароль
                    </button>
                </form>
            </div>

            <div class="back-link">
                <a href="{% url 'loginuser' %}">← Вернуться ко входу</a>
            </div>

            <div class="footer-emojis">
                🔐  🌸  📱
            </div>
        </div>
    </div>

    <script>
        let currentStep = 1;
        let remainingSeconds = 0;
        let timerInterval = null;
        let tempUsername = '';

        // Элементы DOM
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const messageArea = document.getElementById('messageArea');
        const stepIndicator = document.getElementById('stepIndicator');
        const resendBtn = document.getElementById('resendBtn');
        const timerDiv = document.getElementById('timer');
        const phoneInfo = document.getElementById('phoneInfo');

        // Функция показа сообщений
        function showMessage(text, type = 'error') {
            messageArea.innerHTML = `<div class="${type === 'error' ? 'nonfield-errors' : 'success-message'}">${text}</div>`;
            setTimeout(() => {
                if (messageArea.innerHTML === `<div class="${type === 'error' ? 'nonfield-errors' : 'success-message'}">${text}</div>`) {
                    messageArea.innerHTML = '';
                }
            }, 5000);
        }

        // Обновление индикатора шагов
        function updateStepIndicator(step) {
            const steps = stepIndicator.querySelectorAll('.step');
            steps.forEach((s, index) => {
                if (index + 1 <= step) {
                    s.classList.add('active');
                } else {
                    s.classList.remove('active');
                }
            });
        }

        // Переключение между шагами
        function goToStep(step) {
            currentStep = step;
            step1.classList.add('hidden');
            step2.classList.add('hidden');
            step3.classList.add('hidden');

            if (step === 1) step1.classList.remove('hidden');
            if (step === 2) step2.classList.remove('hidden');
            if (step === 3) step3.classList.remove('hidden');

            updateStepIndicator(step);

            // Фокус на нужное поле
            if (step === 1) document.getElementById('username').focus();
            if (step === 2) document.getElementById('code').focus();
            if (step === 3) document.getElementById('new_password').focus();
        }

        // Таймер для повторной отправки
        function startTimer(seconds = 60) {
            remainingSeconds = seconds;
            resendBtn.disabled = true;

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    resendBtn.disabled = false;
                    timerDiv.textContent = 'Вы можете запросить новый код';
                } else {
                    timerDiv.textContent = `Повторная отправка через ${remainingSeconds} секунд`;
                    remainingSeconds--;
                }
            }, 1000);
        }

        // ШАГ 1: Отправка логина для получения кода
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            tempUsername = username;

            if (!username) {
                showMessage('Введите имя пользователя');
                return;
            }

            // Показываем загрузку
            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = '⏳ Отправляем...';
            btn.disabled = true;

            try {
                const response = await fetch('', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ username: username })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ Код отправлен на ваш номер телефона!', 'success');
                    phoneInfo.textContent = `Код отправлен на номер ${data.phone_masked || 'ваш телефон'}`;
                    startTimer(60);
                    goToStep(2);
                } else {
                    showMessage(data.error || 'Пользователь не найден или у него не указан телефон');
                }
            } catch (error) {
                showMessage('Ошибка соединения. Попробуйте позже.');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });

        // ШАГ 2: Проверка кода
        document.getElementById('codeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('code').value.trim();

            if (!code || code.length !== 6) {
                showMessage('Введите 6-значный код из SMS');
                return;
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = '⏳ Проверяем...';
            btn.disabled = true;

            try {
                const response = await fetch('', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        username: tempUsername,
                        code: code
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ Код подтверждён! Придумайте новый пароль.', 'success');
                    goToStep(3);
                } else {
                    showMessage(data.error || 'Неверный код. Попробуйте ещё раз.');
                }
            } catch (error) {
                showMessage('Ошибка проверки кода');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });

        // Повторная отправка кода
        resendBtn.addEventListener('click', async () => {
            if (resendBtn.disabled) return;

            resendBtn.disabled = true;
            resendBtn.textContent = '⏳ Отправляем...';

            try {
                const response = await fetch('', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ username: tempUsername })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ Новый код отправлен!', 'success');
                    startTimer(60);
                } else {
                    showMessage(data.error || 'Не удалось отправить код');
                    resendBtn.disabled = false;
                }
            } catch (error) {
                showMessage('Ошибка отправки');
                resendBtn.disabled = false;
            } finally {
                resendBtn.textContent = '📱 Отправить код повторно';
            }
        });

        // ШАГ 3: Установка нового пароля
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (!newPassword || newPassword.length < 6) {
                showMessage('Пароль должен быть не менее 6 символов');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('Пароли не совпадают');
                return;
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = '⏳ Сохраняем...';
            btn.disabled = true;

            try {
                const response = await fetch('', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        username: tempUsername,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ Пароль успешно изменён! Сейчас вас перенаправим...', 'success');
                    setTimeout(() => {
                        window.location.href = '{% url "loginuser" %}';
                    }, 2000);
                } else {
                    showMessage(data.error || 'Ошибка при смене пароля');
                }
            } catch (error) {
                showMessage('Ошибка соединения');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });

        // Автоматический переход на следующий шаг при вводе кода (если 6 символов)
        document.getElementById('code').addEventListener('input', (e) => {
            if (e.target.value.length === 6) {
                document.getElementById('codeForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
