<!-- landing.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit tracker — твои привычки с заботой</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fef5f7 0%, #fef0f5 100%);
            position: relative;
            color: #4a2f3a;
        }

        /* Цветочки на фоне */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="5" y="25" font-size="22" fill="%23e8c4d0" opacity="0.3">🌸</text><text x="45" y="70" font-size="18" fill="%23f0d0d8" opacity="0.25">🌼</text><text x="75" y="40" font-size="16" fill="%23e8c4d0" opacity="0.2">🌷</text></svg>');
            background-repeat: repeat;
            background-size: 70px 70px;
            pointer-events: none;
            z-index: 0;
        }

        /* Менюшка */
        .simple-menu {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            padding: 1rem 2rem;
            display: flex;
            justify-content: flex-end;
            gap: 2rem;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            z-index: 10;
            border-bottom: 1px solid rgba(255, 200, 200, 0.3);
        }

        .simple-menu a {
            text-decoration: none;
            color: #8e6b78;
            font-weight: 500;
            transition: color 0.3s;
        }

        .simple-menu a:hover {
            color: #d9a5b3;
        }

        /* Основной контейнер */
        .landing-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 2rem 3rem;
            position: relative;
            z-index: 1;
        }

        .landing-container {
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
        }

        /* Карточка */
        .landing-card {
            background: white;
            border-radius: 40px;
            padding: 3rem 2.5rem;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid #f2e4e8;
            text-align: center;
        }

        /* Приветственный эмодзи */
        .hero-emoji {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: wave 2s infinite;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(-5deg); }
        }

        /* Заголовок */
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #4a2f3a;
            line-height: 1.3;
        }

        /* Подзаголовок */
        .subtitle {
            font-size: 1.1rem;
            color: #b0949e;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* Фразы-мотивашки */
        .quotes {
            background: #fef5f7;
            border-radius: 28px;
            padding: 1.5rem;
            margin: 2rem 0;
        }

        .quote {
            font-size: 1rem;
            color: #8e6b78;
            margin: 0.8rem 0;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            justify-content: center;
        }

        .quote span {
            font-size: 1.3rem;
        }

        /* Кнопка */
        .btn-start {
            display: inline-block;
            background: #d9a5b3;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            margin: 1rem 0 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-start:hover {
            background: #c48b9b;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(217, 165, 179, 0.3);
        }

        /* Текст под кнопкой */
        .free-text {
            color: #c8adb6;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        /* Эмодзи в подвале */
        .footer-emojis {
            margin-top: 2rem;
            font-size: 1.2rem;
            opacity: 0.5;
            letter-spacing: 0.5rem;
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            .landing-card {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .btn-start {
                font-size: 1rem;
                padding: 0.8rem 2rem;
            }

            .simple-menu {
                padding: 0.8rem 1.5rem;
            }

            .quote {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Менюшка -->
    <div class="simple-menu">
        <a href="#">Главная</a>
        <a href="#">О нас</a>
        <a href="#">Помощь</a>
    </div>

    <div class="landing-wrapper">
        <div class="landing-container">
            <div class="landing-card">
                <!-- Приветственный эмодзи -->
                <div class="hero-emoji">
                    🌸
                </div>

                <!-- Заголовок -->
                <h1>Твои привычки<br>с заботой о тебе</h1>

                <!-- Подзаголовок -->
                <div class="subtitle">
                    Маленькие шаги каждый день —<br>
                    большие изменения в жизни
                </div>

                <!-- Мотивационные фразы -->
                <div class="quotes">
                    <div class="quote">
                        <span>☀️</span> Один день — одна привычка
                    </div>
                    <div class="quote">
                        <span>⭐</span> Ты лучше, чем был вчера
                    </div>
                    <div class="quote">
                        <span>🌸</span> Всё получится, я рядом
                    </div>
                </div>

                <!-- Кнопка "Начать" -->
                <a href="{% url 'register' %}" class="btn-start">
                    ✨ Начать
                </a>

                <!-- Текст под кнопкой -->
                <div class="free-text">
                    Это бесплатно и навсегда
                </div>

                <!-- Эмодзи в подвале -->
                <div class="footer-emojis">
                    💫 🕊️ 🌱
                </div>
            </div>
        </div>
    </div>
</body>
</html>
